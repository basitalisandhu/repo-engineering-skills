name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate structure, skills and house style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Repository validator
        run: python3 scripts/validate_plugin.py
      - name: Check this README with the bundled checkers
        run: |
          python3 plugins/repo-engineering/skills/readme-who-what-why/scripts/readme_check.py README.md
          python3 plugins/repo-engineering/skills/docs-truth-check/scripts/docs_truth_check.py . --docs README.md --docs plugins/repo-engineering/README.md --exclude tests/fixtures --only-failures
      - name: Run the hygiene bundle on this repository (fixtures hold planted defects, so they are left out)
        run: python3 plugins/repo-engineering/skills/repo-hygiene-bundle/scripts/hygiene.py . --exclude tests/fixtures --fail-on medium

  tests:
    name: Tests and lint
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff
      - run: ruff check .
      - run: python -m pytest -q

  container-build:
    name: Build the container image and run it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image, print --help, run each subcommand's --help and check the user
        run: |
          docker build --build-arg VERSION=ci -t repo-engineering-skills:ci .
          docker run --rm repo-engineering-skills:ci --help > help.txt && grep "^usage: repo-engineering <subcommand>" help.txt
          docker run --rm repo-engineering-skills:ci > /dev/null && grep -c "^  [a-z]" help.txt
          for s in docs-truth repo-facts audit-validate context-lint readme-check test-gaps onboarding onboarding-lint restructure adr adr-lint hygiene release-notes branch-sweep plan-grill; do docker run --rm repo-engineering-skills:ci "$s" --help > /dev/null; done
          docker run --rm --entrypoint git repo-engineering-skills:ci --version
          docker run --rm repo-engineering-skills:ci --version
          test "$(docker run --rm --entrypoint id repo-engineering-skills:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint pwd repo-engineering-skills:ci)" = "/work"

  claude-plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/repo-engineering
